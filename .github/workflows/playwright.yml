name: Playwright Tests
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        TEST_ENV: staging
        LOGIN_URL: ${{ vars['STAGING_LOGIN_URL'] }}
        SHOP_URL: ${{ vars.STAGING_SHOP_URL }}
        LOGIN_USERNAME: ${{ secrets.STAGING_LOGIN_USERNAME }}
        LOGIN_PASSWORD: ${{ secrets.STAGING_LOGIN_PASSWORD }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
